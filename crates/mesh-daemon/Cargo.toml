[package]
name = "mesh-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
unsigned-development = []

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
jsonschema = { version = "=0.49.2", default-features = false }
mesh-win32 = { path = "../mesh-win32" }
rand = "0.9.2"
rusqlite = { version = "0.38.0", features = ["backup", "bundled", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio-stream = "0.1"
toml = "0.9"
tokio = { version = "1.48", default-features = false, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "time"] }
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.24.0"
